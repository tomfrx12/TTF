<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d92027;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#750000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a1c1c;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#222222" />

  <circle cx="256" cy="256" r="180" fill="url(#glowGradient)" />

  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGradient)" stroke-width="4" filter="url(#dropShadow)" />

  <g filter="url(#dropShadow)">
    <path d="M 248 180 
             L 160 180 
             L 160 200 
             L 185 220 
             L 205 220 
             L 205 310 
             L 248 350 
             Z" 
          fill="url(#metalGradient)" stroke="#8a1c1c" stroke-width="1" />

    <path d="M 264 180 
             L 352 180 
             L 352 200 
             L 327 220 
             L 307 220 
             L 307 240 
             L 337 240 
             L 337 270 
             L 307 270 
             L 307 310 
             L 264 350 
             Z" 
          fill="url(#metalGradient)" stroke="#8a1c1c" stroke-width="1" />
  </g>
</svg>