services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttf_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    depends_on:
      - postgres_db
    volumes:
      - ttf_uploads:/app/public/uploads
    networks:
      - ttf_net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.ttf.rule=Host(`ttf.tom-fourneaux.fr`)"
      - "traefik.http.routers.ttf.entrypoints=websecure"
      - "traefik.http.routers.ttf.tls.certresolver=myresolver"
      - "traefik.http.services.ttf.loadbalancer.server.port=3000"

  postgres_db:
    image: postgres:15-alpine
    container_name: ttf_postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ttf_net

networks:
  ttf_net:
    driver: bridge
  web:
    external: true

volumes:
  postgres_data:
  ttf_uploads:
